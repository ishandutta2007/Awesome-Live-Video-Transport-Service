<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulse-line {
        stroke-dasharray: 20, 15;
        animation: dash 12s linear infinite;
      }
      .node-pulse {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to { stroke-dashoffset: -350; }
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.6; }
        100% { transform: scale(1.3); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250" />
    <path d="M 200,0 L 200,300 M 400,0 L 400,300 M 600,0 L 600,300 M 800,0 L 800,300 M 1000,0 L 1000,300" />
  </g>

  <!-- Dynamic/Animated Video Transport Signal Pathways (Background Layer) -->
  <g opacity="0.4">
    <!-- Stream path 1 -->
    <path class="pulse-line" d="M -50 220 Q 250 80 600 240 T 1250 100" fill="none" stroke="#38bdf8" stroke-width="3" />
    <!-- Stream path 2 -->
    <path class="pulse-line" d="M -50 80 Q 350 260 700 60 T 1250 220" fill="none" stroke="#818cf8" stroke-width="2.5" />
    <!-- Stream path 3 -->
    <path class="pulse-line" d="M -50 150 C 300 280 800 20 1250 180" fill="none" stroke="#c084fc" stroke-width="2" />
  </g>

  <!-- Connecting Nodes (Background Layer) -->
  <g fill="#38bdf8" opacity="0.5">
    <circle cx="200" cy="140" r="4" class="node-pulse" />
    <circle cx="450" cy="210" r="5" class="node-pulse" />
    <circle cx="750" cy="90" r="4.5" class="node-pulse" />
    <circle cx="980" cy="200" r="6" class="node-pulse" />
  </g>

  <!-- Foreground Text Content (Prominent & Clear) -->
  <g text-anchor="middle">
    <!-- Icon / Protocol Emblem -->
    <g transform="translate(600, 75)">
      <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="url(#textGrad)" stroke-width="3" filter="url(#glow)" />
      <!-- Play/Stream Triangle -->
      <polygon points="-8,-12 14,0 -8,12" fill="url(#textGrad)" />
    </g>

    <!-- Main Title -->
    <text x="600" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="1.5" fill="url(#textGrad)" filter="url(#glow)">
      Awesome Live Video Transport Service 🚀
    </text>

    <!-- Subtitle -->
    <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="500" font-size="20" fill="#94a3b8" letter-spacing="0.5">
      📡 Protocols, Gateways &amp; Infrastructure • SRT, RIST, Zixi, WebRTC &amp; Cloud Media Routing 🎥
    </text>

    <!-- Tech Pills Badges in Banner -->
    <g transform="translate(600, 240)" font-family="sans-serif" font-size="12" font-weight="bold">
      <!-- Pill 1: Ultra Low Latency -->
      <g transform="translate(-210, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="0" y="4" fill="#38bdf8">⚡ Sub-Second Latency</text>
      </g>
      <!-- Pill 2: Open Protocols -->
      <g transform="translate(-60, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
        <text x="0" y="4" fill="#818cf8">🌐 SRT / RIST / Zixi</text>
      </g>
      <!-- Pill 3: Enterprise & OSS -->
      <g transform="translate(85, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
        <text x="0" y="4" fill="#c084fc">🛠️ SaaS &amp; Open Source</text>
      </g>
      <!-- Pill 4: Broadcast Quality -->
      <g transform="translate(225, 0)">
        <rect x="-55" y="-14" width="110" height="28" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
        <text x="0" y="4" fill="#34d399">📺 Broadcast Quality</text>
      </g>
    </g>
  </g>
</svg>
